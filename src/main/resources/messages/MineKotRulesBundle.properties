minekot.codestyle.comment-formatting.name=Comment formatting
minekot.codestyle.comment-formatting.description=Requires comments to use surrounding indentation and marker spacing.
minekot.concurrency.coroutine-preference.name=Coroutine preference
minekot.concurrency.coroutine-preference.description=Prefers coroutines and platform dispatch abstractions over direct scheduler APIs.
minekot.concurrency.main-thread-blocking.name=Main-thread blocking call
minekot.concurrency.main-thread-blocking.description=Prevents resolved blocking IO, database, and sleep calls from running on a proven platform main thread.
minekot.codestyle.explicit-scope-in-nested-scope.name=Explicit scope in nested scope
minekot.codestyle.explicit-scope-in-nested-scope.description=Requires implicit outer members in plain nested lambdas to use a labeled receiver.
minekot.codestyle.for-each-preference.name=forEach preference
minekot.codestyle.for-each-preference.description=Prefers forEach for straightforward collection iteration.
minekot.correctness.forbidden-try-catch.name=Forbidden try/catch
minekot.correctness.forbidden-try-catch.description=Requires exception boundaries to preserve cancellation and handle failures explicitly.
minekot.codestyle.gradle-dsl-conventions.name=Gradle DSL conventions
minekot.codestyle.gradle-dsl-conventions.description=Requires declarative, reproducible, type-safe Gradle Kotlin DSL.
minekot.performance.gradle-configuration.name=Gradle configuration performance
minekot.performance.gradle-configuration.description=Preserves configuration avoidance, task caching, and configuration-cache compatibility.
minekot.gradle.repository-policy.name=Gradle repository policy
minekot.gradle.repository-policy.description=Requires repository declarations to use the repositories block, deterministic order, and concise syntax.
minekot.gradle.dependency-policy.name=Gradle dependency policy
minekot.gradle.dependency-policy.description=Requires reproducible dependency versions and supported dependency notation.
minekot.gradle.task-contract.name=Gradle task contract
minekot.gradle.task-contract.description=Requires lazy, action-named tasks with complex work implemented by typed task classes.
minekot.gradle.test-configuration.name=Gradle test configuration
minekot.gradle.test-configuration.description=Requires configured Test tasks to declare their framework and bounded parallel execution.
minekot.codestyle.import-policy.name=Import policy
minekot.codestyle.import-policy.description=Uses data-driven wildcard thresholds and qualified nested classes.
minekot.codestyle.kotlinx-preference.name=Kotlinx preference
minekot.codestyle.kotlinx-preference.description=Legacy syntactic preference for Kotlin and kotlinx APIs over Java equivalents.
minekot.codestyle.line-wrapping.name=Line wrapping
minekot.codestyle.line-wrapping.description=Wraps safely structured lines beyond 120 characters.
minekot.codestyle.magic-number.name=Magic number
minekot.codestyle.magic-number.description=Requires non-trivial numeric literals to be given intent-revealing names.
minekot.codestyle.minimessage-text.name=MiniMessage text
minekot.codestyle.minimessage-text.description=Requires MiniMessage templates on resolved Adventure text surfaces.
minekot.codestyle.missing-kdoc.name=Missing KDoc
minekot.codestyle.missing-kdoc.description=Requires useful KDoc for API contracts and non-obvious internal state.
minekot.codestyle.resolved-api-preference.name=Resolved API preference
minekot.codestyle.resolved-api-preference.description=Prefers Kotlin, kotlinx, and MineKot APIs over direct JDK APIs.
minekot.correctness.result-handling.name=Result handling
minekot.correctness.result-handling.description=Requires Result values to be handled explicitly.
minekot.codestyle.source-file-policy.name=Source file policy
minekot.codestyle.source-file-policy.description=Requires UTF-8 without BOM and balanced formatter-control tags.
minekot.codestyle.string-template-braces.name=String template braces
minekot.codestyle.string-template-braces.description=Requires braces around simple Kotlin string-template entries.
minekot.codestyle.trailing-comma.name=Trailing comma
minekot.codestyle.trailing-comma.description=Requires trailing commas in supported multiline lists.
minekot.codestyle.whitespace-formatting.name=Whitespace formatting
minekot.codestyle.whitespace-formatting.description=Enforces indentation, trailing whitespace, delimiter spacing, and operator spacing.

