# MineKot rules verification
name: Build and check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum core 1.0.0
            core-version: 1.0.0
          - name: Current core 1.0.0
            core-version: 1.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Verify thin catalog and selected core linkage
        run: >-
          ./gradlew clean check -PminekotInspectionsVersion="${{ matrix.core-version }}"
          --warning-mode=fail --no-scan --no-daemon --no-configuration-cache --no-build-cache
