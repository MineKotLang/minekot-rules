[versions]
# ---------------------------------------------------------
# Kotlin & Core
# ---------------------------------------------------------
kotlin = "2.4.20"
minekot-toolchain = "1.3.5"
detekt = "2.0.0-alpha.6"
junit = "4.13.2"
idea-version = "2026.1.5"
minekot-inspections = "1.0.2"
core-compatibility-minimum = "1.0.0"
core-compatibility-maximum-exclusive = "2.0.0"
kotlinx-serialization = "1.11.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
junit = { module = "junit:junit", version.ref = "junit" }
minekot-inspections-core = { module = "org.minekot.inspections:minekot-inspections-core", version.ref = "minekot-inspections" }
minekot-inspections-detekt = { module = "org.minekot.inspections:minekot-inspections-detekt", version.ref = "minekot-inspections" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
minekot-toolchain = { id = "org.minekot.toolchain", version.ref = "minekot-toolchain" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform" }
